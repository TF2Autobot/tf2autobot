name: Docker

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
    tags-ignore:
      - "*"

jobs:
  push:
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node:
          - 22-alpine
          - 22-bookworm
          - 22-bookworm-slim
          - 22-bullseye
          - 22-bullseye-slim

    name: Tag Commit (node:${{ matrix.node }})

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build final image
        uses: docker/build-push-action@v7.3.0
        with:
          # Conditionally push only if the event is a push to master OR IPC
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/IPC') }}
          tags: tf2autobot/tf2autobot:${{ github.sha }}-${{ matrix.node }}
